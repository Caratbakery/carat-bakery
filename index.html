<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>克拉烘焙台 · CARAT BAKING STUDIO</title>
<meta name="description" content="SEVENTEEN 应援主题专属烘焙工作台：配方查询、份数换算、卡路里测算、离线使用。">
<meta name="theme-color" content="#8FBEF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="克拉烘焙台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>/* ===== 克拉烘焙台 · SEVENTEEN 蓝粉应援色系统 ===== */
:root{
  /* SEVENTEEN 应援色：Rose Quartz 玫瑰石英粉 + Serenity 宁静蓝 */
  --sv-blue:#8FB4E8;
  --sv-blue-d:#5C8FD6;
  --sv-blue-l:#D6E5FA;
  --sv-pink:#F7B6D2;
  --sv-pink-d:#EE85B5;
  --sv-pink-l:#FDE0EC;
  --grad:linear-gradient(115deg,var(--sv-blue) 0%,#B3B8EE 48%,var(--sv-pink) 100%);
  --grad-soft:linear-gradient(115deg,var(--sv-blue-l) 0%,#EDE7FB 50%,var(--sv-pink-l) 100%);
  --grad-rev:linear-gradient(115deg,var(--sv-pink) 0%,#C3AEE8 50%,var(--sv-blue) 100%);

  --bg:#FBF7FA;
  --bg2:#FFFFFF;
  --card:rgba(255,255,255,.86);
  --card-solid:#FFFFFF;
  --ink:#3B3450;
  --ink2:#6E6684;
  --ink3:#9A93AC;
  --line:rgba(143,180,232,.28);
  --line2:rgba(247,182,210,.38);
  --shadow:0 6px 22px rgba(120,130,190,.13);
  --shadow-l:0 14px 40px rgba(120,130,190,.20);
  --radius:22px;
  --radius-s:14px;
  --wall-op:.20;
  --fs:16px;
}
html[data-theme="dark"]{
  --bg:#191627;
  --bg2:#221E36;
  --card:rgba(40,35,62,.82);
  --card-solid:#2A2542;
  --ink:#F2EEFA;
  --ink2:#C3BCDA;
  --ink3:#8F87AD;
  --line:rgba(143,180,232,.30);
  --line2:rgba(247,182,210,.30);
  --shadow:0 6px 22px rgba(0,0,0,.34);
  --shadow-l:0 14px 40px rgba(0,0,0,.46);
  --sv-blue-l:#31456B;
  --sv-pink-l:#5A2E45;
  --grad-soft:linear-gradient(115deg,#2E3F63 0%,#3A3357 50%,#54304A 100%);
  --wall-op:.13;
}
html[data-fs="s"]{--fs:14.5px}
html[data-fs="m"]{--fs:16px}
html[data-fs="l"]{--fs:17.8px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);transition:font-size .25s ease}
body{
  margin:0;min-height:100vh;color:var(--ink);background:var(--bg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Nunito",system-ui,sans-serif;
  transition:background .4s ease,color .4s ease;overflow-x:hidden;
}

/* ---- 虚化全员合照背景 ---- */
#photoWall{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  filter:blur(7px) saturate(1.15);opacity:var(--wall-op);
  transition:opacity .4s ease;
}
#photoWall img{width:min(1500px,132vw);height:auto;max-height:none;object-fit:cover;object-position:center top}
#photoVeil{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 18% 8%,rgba(143,180,232,.30),transparent 62%),
    radial-gradient(1000px 640px at 88% 92%,rgba(247,182,210,.32),transparent 62%),
    linear-gradient(180deg,rgba(251,247,250,.72),rgba(251,247,250,.90));
}
html[data-theme="dark"] #photoVeil{
  background:
    radial-gradient(1100px 620px at 18% 8%,rgba(92,143,214,.24),transparent 62%),
    radial-gradient(1000px 640px at 88% 92%,rgba(238,133,181,.20),transparent 62%),
    linear-gradient(180deg,rgba(25,22,39,.80),rgba(25,22,39,.93));
}

/* ---- 顶部栏 ---- */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem 1.2rem;
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:2px solid transparent;
  border-image:var(--grad) 1;
  box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:.7rem;cursor:pointer;user-select:none}
.brand-logo{
  font-size:1.9rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(238,133,181,.45));
  animation:bob 3.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.brand-txt h1{
  margin:0;font-size:1.42rem;letter-spacing:.06em;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-txt p{margin:.1rem 0 0;font-size:.62rem;letter-spacing:.22em;color:var(--ink3);display:flex;align-items:center;gap:.3rem}
.dot-b,.dot-p{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-b{background:var(--sv-blue-d)}.dot-p{background:var(--sv-pink-d)}

.topbar-tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.search-box{
  display:flex;align-items:center;gap:.45rem;
  background:var(--bg2);border:2px solid var(--line);border-radius:999px;
  padding:.42rem .9rem;min-width:min(320px,42vw);transition:.25s;
}
.search-box:focus-within{border-color:var(--sv-pink-d);box-shadow:0 0 0 4px rgba(247,182,210,.25)}
.search-box input{border:0;background:transparent;outline:0;color:var(--ink);font-size:.86rem;width:100%;font-family:inherit}
.search-ico{font-size:.9rem}
.search-clear{border:0;background:var(--sv-pink-l);color:var(--ink2);border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem;line-height:1}

.fs-group{display:flex;background:var(--bg2);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.fs-group button{
  border:0;background:transparent;cursor:pointer;color:var(--ink2);
  padding:.34rem .62rem;font-weight:800;font-size:.78rem;font-family:inherit;transition:.22s;
}
.fs-group button.on{background:var(--grad);color:#fff}
.fs-group button:hover:not(.on){background:var(--sv-blue-l)}

.icon-btn{
  border:2px solid var(--line);background:var(--bg2);color:var(--ink2);cursor:pointer;
  border-radius:999px;padding:.36rem .78rem;font-size:.8rem;font-weight:700;font-family:inherit;
  display:inline-flex;align-items:center;gap:.32rem;transition:.22s;
}
.icon-btn:hover{border-color:var(--sv-pink-d);color:var(--ink);transform:translateY(-1px)}

/* ---- 布局 ---- */
.layout{position:relative;z-index:2;display:flex;align-items:flex-start;gap:1.1rem;padding:1.1rem;max-width:1560px;margin:0 auto}
.sidebar{
  position:sticky;top:5.1rem;width:250px;flex:0 0 250px;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:2px solid var(--line);border-radius:var(--radius);
  padding:.9rem .75rem;box-shadow:var(--shadow);
  max-height:calc(100vh - 6.4rem);overflow-y:auto;scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--grad);border-radius:9px}
.side-head{display:flex;align-items:center;justify-content:space-between;margin:.1rem .35rem .7rem}
.side-title{font-weight:900;font-size:.92rem;letter-spacing:.04em}
.cat-nav{display:flex;flex-direction:column;gap:.34rem}
.cat-item{
  display:flex;align-items:center;gap:.55rem;width:100%;
  border:2px solid transparent;background:transparent;cursor:pointer;font-family:inherit;
  border-radius:16px;padding:.48rem .55rem;color:var(--ink);text-align:left;transition:.24s cubic-bezier(.34,1.4,.64,1);
}
.cat-item:hover{background:var(--grad-soft);transform:translateX(3px)}
.cat-item.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(143,180,232,.42)}
.cat-item.on .cat-count{background:rgba(255,255,255,.34);color:#fff}
.cat-ico{position:relative;width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;
  background:var(--bg2);border-radius:12px;font-size:1.08rem;box-shadow:inset 0 0 0 2px var(--line2)}
.cat-item.on .cat-ico{background:rgba(255,255,255,.94)}
.cat-ico .mini-m{position:absolute;right:-7px;bottom:-6px;width:20px;height:20px;border-radius:50%;overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.18);background:#fff}
.cat-ico .mini-m img,.cat-ico .mini-m svg{width:100%;height:100%;display:block;object-fit:cover}
.cat-name{flex:1;font-size:.85rem;font-weight:800}
.cat-count{
  font-size:.66rem;font-weight:900;padding:.12rem .44rem;border-radius:999px;
  background:var(--sv-pink-l);color:var(--sv-pink-d);
}
html[data-theme="dark"] .cat-count{color:#FFD7E8}
.side-foot{margin-top:.9rem;padding-top:.7rem;border-top:2px dashed var(--line2);display:flex;flex-direction:column;gap:.5rem}
.member-strip{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding:.2rem 0}
.member-strip .m-chip{width:26px;height:26px;border-radius:50%;overflow:hidden;background:var(--bg2);
  box-shadow:0 2px 6px rgba(0,0,0,.10);transition:.2s;cursor:default}
.member-strip .m-chip:hover{transform:translateY(-4px) scale(1.14)}
.member-strip img,.member-strip svg{width:100%;height:100%;display:block;object-fit:cover}
.offline-tag{margin:0;text-align:center;font-size:.62rem;color:var(--ink3);letter-spacing:.05em}

.btn-primary{
  border:0;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;
  background:var(--grad);border-radius:999px;padding:.55rem 1.05rem;font-size:.84rem;
  box-shadow:0 6px 16px rgba(143,180,232,.44);transition:.24s cubic-bezier(.34,1.4,.64,1);
}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 24px rgba(238,133,181,.46)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{
  border:2px solid var(--line);background:var(--bg2);color:var(--ink2);cursor:pointer;font-family:inherit;
  font-weight:800;border-radius:999px;padding:.5rem 1rem;font-size:.82rem;transition:.22s;
}
.btn-ghost:hover{border-color:var(--sv-pink-d);color:var(--ink)}
.block{width:100%}
.tiny{font-size:.7rem;padding:.36rem .7rem}

/* ---- 主区域 ---- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.1rem}

.hero{
  position:relative;overflow:hidden;border-radius:var(--radius);padding:1.5rem 1.6rem;
  background:var(--grad-soft);border:2px solid var(--line2);box-shadow:var(--shadow);
}
.hero h2{margin:0 0 .35rem;font-size:1.55rem;font-weight:900;letter-spacing:.02em}
.hero p{margin:0;color:var(--ink2);font-size:.86rem;line-height:1.7;max-width:44rem}
.hero-row{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.hero-members{display:flex;align-items:flex-end;padding-left:11px}
.hero-members .h-m{width:46px;height:46px;border-radius:50%;background:var(--card-solid);margin-left:-11px;
  box-shadow:0 4px 12px rgba(120,130,190,.26);overflow:hidden;transition:.3s cubic-bezier(.34,1.5,.64,1)}
.hero-members .h-m:hover{transform:translateY(-9px) scale(1.12);z-index:5}
.hero-members img,.hero-members svg{width:100%;height:100%;display:block;object-fit:cover}
.hero-deco{position:absolute;font-size:6.5rem;opacity:.14;right:1.2rem;top:-1rem;transform:rotate(-12deg);pointer-events:none}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem}
.stat{
  position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(12px);
  border:2px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);
  transition:.3s cubic-bezier(.34,1.4,.64,1);
}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-l);border-color:var(--sv-pink-d)}
.stat .s-lab{font-size:.74rem;color:var(--ink2);font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:.35rem}
.stat .s-val{font-size:2.1rem;font-weight:900;line-height:1.15;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .s-sub{font-size:.68rem;color:var(--ink3)}
.stat .s-bar{height:6px;border-radius:9px;background:var(--sv-blue-l);margin-top:.5rem;overflow:hidden}
.stat .s-bar i{display:block;height:100%;background:var(--grad);border-radius:9px;animation:grow 1.1s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{width:0}}
.stat .s-m{position:absolute;right:.6rem;bottom:.4rem;width:44px;height:44px;opacity:.4}
.stat .s-m svg{width:100%;height:100%}

.sec-title{display:flex;align-items:center;gap:.55rem;margin:.2rem 0 -.2rem}
.sec-title h3{margin:0;font-size:1.06rem;font-weight:900}
.sec-title .line{flex:1;height:3px;border-radius:9px;background:var(--grad);opacity:.5}

.jump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.jump{
  position:relative;overflow:hidden;cursor:pointer;font-family:inherit;text-align:left;
  border:2px solid var(--line);border-radius:20px;padding:.85rem .9rem 1.7rem;
  background:var(--card);backdrop-filter:blur(10px);box-shadow:var(--shadow);
  transition:.3s cubic-bezier(.34,1.4,.64,1);color:var(--ink);
}
.jump:hover{transform:translateY(-5px) rotate(-.6deg);border-color:var(--sv-pink-d);box-shadow:var(--shadow-l)}
.jump .j-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.jump .j-emoji{font-size:1.6rem}
.jump .j-m{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--bg2);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.jump .j-m img,.jump .j-m svg{width:100%;height:100%;display:block;object-fit:cover}
.jump .j-name{font-weight:900;font-size:.95rem}
.jump .j-sub{font-size:.68rem;color:var(--ink3);margin-top:.15rem;line-height:1.35;min-height:1.85em}
.jump .j-go{position:absolute;right:.7rem;bottom:.55rem;font-size:.72rem;font-weight:900;color:var(--sv-blue-d);background:var(--card);padding:.1rem .25rem;border-radius:6px}
.jump::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:var(--grad);opacity:.13}

/* ---- 分类页头 ---- */
.cat-head{
  display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;
  background:var(--card);backdrop-filter:blur(12px);border:2px solid var(--line);
  border-radius:var(--radius);padding:.95rem 1.15rem;box-shadow:var(--shadow);
}
.cat-head .ch-ico{font-size:2rem}
.cat-head h2{margin:0;font-size:1.28rem;font-weight:900}
.cat-head p{margin:.15rem 0 0;font-size:.75rem;color:var(--ink2)}
.cat-head .spacer{flex:1}
.cat-head .ch-m{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bg2);box-shadow:0 3px 9px rgba(0,0,0,.12)}
.cat-head .ch-m img,.cat-head .ch-m svg{width:100%;height:100%;display:block;object-fit:cover}

/* ---- 配方卡片 ---- */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1rem}
.rc{
  display:flex;flex-direction:column;
  background:var(--card);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
  border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;transition:.3s cubic-bezier(.34,1.3,.64,1);
  animation:pop .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.rc:hover{transform:translateY(-5px);box-shadow:var(--shadow-l);border-color:var(--sv-pink-d)}
.rc-top{display:flex;align-items:center;gap:.6rem;padding:.85rem .95rem .55rem;background:var(--grad-soft);border-bottom:2px dashed var(--line2)}
.rc-emoji{position:relative;width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;font-size:1.6rem;
  background:var(--card-solid);border-radius:16px;box-shadow:0 3px 10px rgba(120,130,190,.20)}
.rc-emoji .mini-m{position:absolute;right:-8px;bottom:-8px;width:25px;height:25px;border-radius:50%;overflow:hidden;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.20)}
.rc-emoji .mini-m img,.rc-emoji .mini-m svg{width:100%;height:100%;display:block;object-fit:cover}
.rc-tit{flex:1;min-width:0}
.rc-tit h4{margin:0;font-size:1rem;font-weight:900;line-height:1.35}
.rc-tit .rc-mem{font-size:.63rem;color:var(--ink3);letter-spacing:.04em;margin-top:.12rem}
.rc-badge{font-size:.6rem;font-weight:900;padding:.15rem .45rem;border-radius:999px;background:var(--sv-pink-d);color:#fff}

.rc-tags{display:flex;flex-wrap:wrap;gap:.35rem;padding:.6rem .95rem 0}
.tag{
  font-size:.68rem;font-weight:800;padding:.24rem .58rem;border-radius:999px;
  display:inline-flex;align-items:center;gap:.24rem;border:1.5px solid transparent;
}
.tag.t-fire{background:var(--sv-pink-l);color:var(--sv-pink-d);border-color:var(--line2)}
.tag.t-time{background:var(--sv-blue-l);color:var(--sv-blue-d);border-color:var(--line)}
.tag.t-dose{background:transparent;color:var(--ink2);border-color:var(--line)}
html[data-theme="dark"] .tag.t-fire{color:#FFD7E8}
html[data-theme="dark"] .tag.t-time{color:#CFE0FA}

/* 份数换算模块 */
.conv{
  margin:.7rem .95rem 0;padding:.6rem .7rem;border-radius:16px;
  background:var(--bg2);border:2px solid var(--line);
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
}
.conv .c-lab{font-size:.7rem;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:.25rem}
.stepper{display:flex;align-items:center;background:var(--card-solid);border:2px solid var(--line2);border-radius:999px;overflow:hidden}
.stepper button{border:0;background:transparent;cursor:pointer;font-family:inherit;font-weight:900;font-size:.95rem;
  color:var(--sv-blue-d);width:26px;height:26px;transition:.2s}
.stepper button:hover{background:var(--sv-blue-l)}
.stepper input{width:46px;border:0;background:transparent;text-align:center;font-family:inherit;font-weight:900;
  font-size:.86rem;color:var(--ink);outline:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.conv .c-unit{font-size:.72rem;font-weight:800;color:var(--ink2)}
.conv .c-x{font-size:.66rem;font-weight:900;color:#fff;background:var(--grad);padding:.16rem .5rem;border-radius:999px}
.conv .c-reset{margin-left:auto;border:0;background:transparent;cursor:pointer;font-family:inherit;
  font-size:.66rem;color:var(--ink3);text-decoration:underline;padding:0}
.conv .c-reset:hover{color:var(--sv-pink-d)}

/* 卡路里横条 */
.cal{
  margin:.6rem .95rem 0;border-radius:16px;overflow:hidden;
  background:var(--grad);box-shadow:0 5px 14px rgba(143,180,232,.34);
  display:flex;align-items:stretch;color:#fff;
}
.cal .cal-b{flex:1;padding:.5rem .6rem;text-align:center}
.cal .cal-b+.cal-b{border-left:2px dashed rgba(255,255,255,.45)}
.cal .cal-l{font-size:.6rem;font-weight:800;opacity:.94;letter-spacing:.06em}
.cal .cal-v{font-size:1.08rem;font-weight:900;line-height:1.25}
.cal .cal-v small{font-size:.6rem;font-weight:800;margin-left:.1rem}

/* 配料表 */
.ings{margin:.7rem .95rem 0;border-top:2px dashed var(--line2);padding-top:.55rem}
.ings-h{display:flex;align-items:center;justify-content:space-between;font-size:.7rem;font-weight:900;color:var(--ink2);margin-bottom:.3rem}
.ings ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1rem;max-height:250px;overflow:auto}
.ings ul::-webkit-scrollbar{width:5px}
.ings ul::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.ings li{display:flex;align-items:baseline;gap:.35rem;font-size:.78rem;padding:.16rem 0}
.ings li .i-n{color:var(--ink2)}
.ings li .i-dot{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-3px)}
.ings li .i-a{font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.ings li.scaled .i-a{color:var(--sv-pink-d);animation:flash .5s ease}
html[data-theme="dark"] .ings li.scaled .i-a{color:#FFB9D8}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

.rc-foot{display:flex;gap:.4rem;padding:.75rem .95rem .95rem;margin-top:auto}

.modal-body{padding:1rem 1.1rem;overflow-y:auto;display:flex;flex-direction:column;gap:.8rem}

.modal-foot{display:flex;justify-content:flex-end;gap:.5rem;padding:.8rem 1.1rem;border-top:2px solid var(--line);background:var(--bg2)}

}
.greet-close{position:absolute;top:.55rem;right:.55rem;z-index:2}
.greet-ico{

}

.greet-txt .g-name{

.greet-ok{width:100%;padding:.7rem;border-radius:16px}

.step-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.2rem}

.step-tip{font-size:.74rem;color:var(--ink3);text-align:center;padding-top:.3rem}

.f-item{display:flex;flex-direction:column;gap:.32rem}

.f-item .hint{font-weight:600;color:var(--ink3);font-size:.66rem}
.f-item input,.f-item select,.f-item textarea{

.f-2{grid-template-columns:1.4fr 1fr}
.f-3{grid-template-columns:1.2fr 1fr 1.1fr}
.unit-row{display:flex;gap:.4rem}
.unit-row input:first-child{width:60%}
.unit-row input:last-child{width:40%}
.emoji-pick,.member-pick{display:flex;flex-wrap:wrap;gap:.34rem}
.emoji-pick button{

.member-pick button{

.only-mobile{display:none}

(function(){
  'use strict';

  /* 兜底：若分类角标图标变量缺失（例如重切成员图时丢失），则回退到首位成员图标，
     避免初始化时 ReferenceError 导致整页白屏 */
  var _m0 = (typeof MEMBER_ICON_B64 !== 'undefined' && MEMBER_ICON_B64[0]) ? MEMBER_ICON_B64[0] : '';
  if (typeof CAT_SIDEBAR_ICON_B64 === 'undefined') CAT_SIDEBAR_ICON_B64 = _m0;
  if (typeof CAT_JUMP_ICON_B64 === 'undefined') CAT_JUMP_ICON_B64 = _m0;

  /* ---------- 成员卡通图标（用户提供的 base64 图片） ---------- */
  function memberSVG(m){
    var idx = (m && typeof m.idx === 'number') ? m.idx : 0;
    var src = (typeof MEMBER_ICON_B64 !== 'undefined' && MEMBER_ICON_B64[idx]) ? MEMBER_ICON_B64[idx] : '';
    var alt = (m && (m.en || m.cn)) ? (m.en + ' · ' + m.cn) : '';
    return '<img src="'+esc(src)+'" alt="'+esc(alt)+'" draggable="false">';
  }

  /* ---------- 卡路里 & 克重 ---------- */
  function ingGrams(name, qty, unit){
    if(unit === 'g' || unit === '克' || unit === 'ml' || unit === '毫升') return qty;
    if(PIECE_G[name] !== undefined) return qty * PIECE_G[name];
    if(UNIT_G[unit] !== undefined) return qty * UNIT_G[unit];
    return qty; // 兜底按克计
  }
  function kcalDensity(name){
    var best = -1, dens = 0;
    for(var k in KCAL){
      if(name.indexOf(k) >= 0 && k.length > best){ best = k.length; dens = KCAL[k]; }
    }
    return dens;
  }
  function ingKcal(name, qty, unit){
    return ingGrams(name, qty, unit) / 100 * kcalDensity(name);
  }
  function recipeBaseKcal(r){
    var t = 0;
    for(var i = 0; i < r.i.length; i++){
      t += ingKcal(r.i[i][0], r.i[i][1], r.i[i][2]);
    }
    return t;
  }

  /* ---------- 状态 & 存储 ---------- */
  var STORE_KEY = 'carat-bakery-v1';
  function loadStore(){
    try{
      var s = JSON.parse(localStorage.getItem(STORE_KEY));
      if(s && Array.isArray(s.custom) && Array.isArray(s.deleted)) return s;
    }catch(e){}
    return { custom: [], deleted: [] };
  }
  function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }

  var store = loadStore();
  var recipes = RECIPES.filter(function(r){ return store.deleted.indexOf(r.id) < 0; })
                       .concat(store.custom);
  var servings = {}; // id -> 当前份数
  recipes.forEach(function(r){ servings[r.id] = r.b; });

  var state = { view: 'home', cat: null, q: '' };

  function catById(k){ for(var i=0;i<CATS.length;i++) if(CATS[i].k===k) return CATS[i]; return CATS[0]; }
  function memberByIdx(i){ return MEMBERS[i] || MEMBERS[0]; }

  /* ---------- 工具 ---------- */
  function $(s, p){ return (p||document).querySelector(s); }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html != null) e.innerHTML = html;
    return e;
  }
  function fmt(n){
    if(!isFinite(n)) return '0';
    var r = Math.round(n * 10) / 10;
    return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : String(r);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var toastTimer;
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');

  /* ---------- 配方卡片 ---------- */
  function recipeCard(r){
    var m = memberByIdx(r.m);
    var cur = servings[r.id] || r.b;
    var factor = cur / r.b;
    var card = el('div', 'rc');
    card.dataset.id = r.id;

    var tags = '<span class="tag t-fire">🔥 '+esc(r.t)+'</span>'
             + '<span class="tag t-time">⏱ '+esc(r.d)+'</span>'
             + '<span class="tag t-dose">🍽 基准 '+r.b+r.u+'</span>';

    var ings = '';
    for(var i=0;i<r.i.length;i++){
      var ing = r.i[i];
      var q = ing[1] * factor;
      ings += '<li data-q="'+ing[1]+'" data-u="'+esc(ing[2])+'"><span class="i-n">'+esc(ing[0])+'</span>'
            + '<span class="i-dot"></span><span class="i-a">'+fmt(q)+' '+esc(ing[2])+'</span></li>';
    }

    var baseCal = recipeBaseKcal(r);
    var totalCal = baseCal * factor;
    var singleCal = totalCal / cur;

    card.innerHTML = ''
      + '<div class="rc-top">'
      +   '<span class="rc-emoji">'+r.e+'<span class="mini-m">'+memberSVG(m)+'</span></span>'
      +   '<div class="rc-tit"><h4>'+esc(r.n)+'</h4><div class="rc-mem">🎀 应援 · '+esc(m.en)+'</div></div>'
      +   '<span class="rc-badge">'+r.b+r.u+'</span>'
      + '</div>'
      + '<div class="rc-tags">'+tags+'</div>'
      + '<div class="conv">'
      +   '<span class="c-lab">🧮 份数换算</span>'
      +   '<div class="stepper"><button data-act="dec">−</button>'
      +     '<input type="number" min="1" value="'+cur+'" data-act="inp">'
      +     '<button data-act="inc">＋</button></div>'
      +   '<span class="c-unit">'+esc(r.u)+'</span>'
      +   '<span class="c-x">×'+fmt(factor)+'</span>'
      +   '<button class="c-reset" data-act="reset">↺ 复位</button>'
      + '</div>'
      + '<div class="cal"><div class="cal-b"><div class="cal-l">整份总热量</div><div class="cal-v">'+fmt(totalCal)+'<small>kcal</small></div></div>'
      +   '<div class="cal-b"><div class="cal-l">单份热量</div><div class="cal-v">'+fmt(singleCal)+'<small>kcal</small></div></div></div>'
      + '<div class="ings"><div class="ings-h"><span>📋 配料表</span><span>自动按份数换算</span></div>'
      +   '<ul>'+ings+'</ul></div>'
      + '<div class="rc-foot">'
      +   '<button class="btn-primary" data-act="steps">👩‍🍳 制作步骤</button>'
      +   '<button class="mini-btn" data-act="edit" title="编辑">✏️</button>'
      +   '<button class="mini-btn del" data-act="del" title="删除">🗑</button>'
      + '</div>';

    return card;
  }

  function updateCardServings(id, val){
    var card = document.querySelector('.rc[data-id="'+id+'"]');
    if(!card) return;
    var r = recipes.filter(function(x){ return x.id === id; })[0];
    if(!r) return;
    val = Math.max(1, Math.round(val || 1));
    servings[id] = val;
    var factor = val / r.b;
    var inp = card.querySelector('.conv input');
    if(document.activeElement !== inp) inp.value = val;
    card.querySelector('.c-x').textContent = '×' + fmt(factor);
    var lis = card.querySelectorAll('.ings li');
    for(var i=0;i<lis.length;i++){
      var q = parseFloat(lis[i].dataset.q) * factor;
      var u = lis[i].dataset.u;
      var a = lis[i].querySelector('.i-a');
      a.textContent = fmt(q) + ' ' + u;
      a.parentElement.classList.add('scaled');
      (function(li){ setTimeout(function(){ li.classList.remove('scaled'); }, 520); })(lis[i]);
    }
    var baseCal = recipeBaseKcal(r), total = baseCal * factor, single = total / val;
    var cbs = card.querySelectorAll('.cal .cal-v');
    cbs[0].innerHTML = fmt(total) + '<small>kcal</small>';
    cbs[1].innerHTML = fmt(single) + '<small>kcal</small>';
  }

        + '<div class="j-name">'+cat.n+'</div>'
        + '<div class="j-sub">'+cnt+' 款 · '+esc(cat.d)+'</div>'

  function renderCategory(k){
    var cat = catById(k);
    var m = memberByIdx(cat.m);
    var frag = document.createDocumentFragment();
    var head = el('div', 'cat-head');
    head.innerHTML = ''
      + '<span class="ch-ico">'+cat.e+'</span>'
      + '<div><h2>'+cat.n+'</h2><p>'+esc(cat.d)+' · 共 '+recipes.filter(function(r){return r.c===k;}).length+' 款配方</p></div>'
      + '<div class="spacer"></div>'
      + '<span class="ch-m">'+memberSVG(m)+'</span>';
    frag.appendChild(head);

    var list = recipes.filter(function(r){ return r.c === k; });
    if(!list.length){ frag.appendChild(emptyState('🍩','该分类还没有配方','点击右上角「＋ 新增配方」添加第一款吧')); return frag; }
    var grid = el('div', 'recipe-grid');
    list.forEach(function(r){ grid.appendChild(recipeCard(r)); });
    frag.appendChild(grid);
    return frag;
  }

  function renderSearch(q){
    var frag = document.createDocumentFragment();
    var head = el('div', 'cat-head');
    head.innerHTML = '<span class="ch-ico">🔍</span><div><h2>搜索：'+esc(q)+'</h2>'
      + '<p>匹配配方名 / 配料 / 分类 · 共 '+countSearch(q)+' 条结果</p></div>';
    frag.appendChild(head);
    var list = searchRecipes(q);
    if(!list.length){ frag.appendChild(emptyState('🤔','没有找到相关配方','换个关键词试试，或新增一条配方')); return frag; }
    var grid = el('div', 'recipe-grid');
    list.forEach(function(r){ grid.appendChild(recipeCard(r)); });
    frag.appendChild(grid);
    return frag;
  }

  function countSearch(q){ return searchRecipes(q).length; }
  function searchRecipes(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [];
    return recipes.filter(function(r){
      if(r.n.toLowerCase().indexOf(q) >= 0) return true;
      if(catById(r.c).n.indexOf(q) >= 0) return true;
      for(var i=0;i<r.i.length;i++){ if(r.i[i][0].toLowerCase().indexOf(q) >= 0) return true; }
      return false;
    });
  }

  function emptyState(ico, t, sub){

    e.innerHTML = '<span class="e-ico">'+ico+'</span><p><b>'+esc(t)+'</b></p><p>'+esc(sub)+'</p>';

  var EMOJIS = ['🍰','🍞','🍪','🥮','🥟','🍯','🍬','🧋','🧁','🥐','🍫','🍓','🍋','🥯','🍩','🍡','🧇','🥧','🍮','☕','🍵','🍊','🍑','🍇','🫐','🌰','🥥','🍒','🥨','🍕','🧇','🍦'];

  function openForm(r){
    editingId = r ? r.id : null;
    $('#formTitle').textContent = r ? '✏️ 编辑配方' : '✨ 新增配方';
    $('#fName').value = r ? r.n : '';
    $('#fCat').value = r ? r.c : CATS[0].k;
    var em = r ? r.e : '🍰'; $('#fEmoji').value = em;
    $('#fEmojiPick').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.e === em); });
    var mi = r ? r.m : 0;
    $('#fMemberPick').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', +b.dataset.m === mi); });
    $('#fTemp').value = r ? r.t : '';
    $('#fTime').value = r ? r.d : '';
    $('#fBase').value = r ? r.b : 8;
    $('#fUnit').value = r ? r.u : '份';
    $('#fIngs').value = r ? r.i.map(function(x){ return x[0]+' '+x[1]+' '+x[2]; }).join('\n') : '';
    $('#fSteps').value = r ? r.s.join('\n') : '';
    $('#formModal').hidden = false;
  }

  function parseIngs(text){
    var out = [], lines = text.split('\n');
    for(var i=0;i<lines.length;i++){
      var ln = lines[i].trim(); if(!ln) continue;
      var mt = ln.match(/^(.+?)\s+([\d.]+)\s+(\S+)\s*$/);
      if(mt){ out.push([mt[1].trim(), parseFloat(mt[2]), mt[3].trim()]); }
      else { out.push([ln, 0, '适量']); }
    }
    return out;
  }
  function parseSteps(text){
    return text.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s; });
  }
  function saveForm(){
    var name = $('#fName').value.trim() || '未命名配方';
    var ings = parseIngs($('#fIngs').value);
    var steps = parseSteps($('#fSteps').value);
    if(!ings.length){ toast('请至少填写一条配料'); return; }
    var em = $('#fEmoji').value.trim() || '🍰';
    var mi = 0; var onM = $('#fMemberPick').querySelector('button.on'); if(onM) mi = +onM.dataset.m;
    var rec = {
      c: $('#fCat').value, e: em, m: mi, n: name,
      t: $('#fTemp').value.trim() || '室温', d: $('#fTime').value.trim() || '—',
      b: Math.max(1, parseInt($('#fBase').value, 10) || 1), u: $('#fUnit').value.trim() || '份',
      i: ings, s: steps.length ? steps : ['（暂无步骤，自由发挥吧～）']
    };
    if(editingId){
      var idx = recipes.map(function(r){return r.id;}).indexOf(editingId);
      if(idx >= 0) recipes[idx] = Object.assign({}, recipes[idx], rec);
      // 同步到 store.custom
      var ci = store.custom.map(function(r){return r.id;}).indexOf(editingId);
      if(ci >= 0) store.custom[ci] = recipes[idx];
      toast('✅ 已保存修改');
    }else{
      rec.id = 'u-' + Date.now() + '-' + Math.floor(Math.random()*1000);
      recipes.push(rec); store.custom.push(rec);
      toast('✨ 新配方已加入');
    }
    saveStore(store);
    servings[rec.id] = rec.b;
    closeModals();
    renderAll();
  }

  function deleteRecipe(id){
    var r = recipes.filter(function(x){ return x.id === id; })[0];
    if(!r) return;
    if(!confirm('确定删除「'+r.n+'」吗？此操作可在「恢复默认配方库」中撤销自定义改动。')) return;
    recipes = recipes.filter(function(x){ return x.id !== id; });
    if(id.indexOf('u-') === 0){ store.custom = store.custom.filter(function(x){ return x.id !== id; }); }
    else { store.deleted.push(id); }
    saveStore(store);
    delete servings[id];
    toast('🗑 已删除');
    renderAll();
  }

  /* ---------- 事件绑定 ---------- */
  function bindUI(){
    // 顶栏
    $('#brandHome').addEventListener('click', function(){ state.view='home'; state.cat=null; $('#searchInput').value=''; renderAll(); });
    $('#searchInput').addEventListener('input', function(){
      var v = this.value.trim();
      $('#searchClear').hidden = !v;
      if(v){ state.view='search'; state.q=v; renderAll(); }
      else { state.view='home'; renderAll(); }
    });
    $('#searchClear').addEventListener('click', function(){ $('#searchInput').value=''; state.view='home'; state.q=''; this.hidden=true; renderAll(); });
    document.querySelectorAll('.fs-group button').forEach(function(b){ b.addEventListener('click', function(){ setFs(b.dataset.fs); }); });
    $('#themeBtn').addEventListener('click', toggleTheme);
    $('#drawerBtn').addEventListener('click', openDrawer);
    $('#drawerClose').addEventListener('click', closeDrawer);
    $('#drawerMask').addEventListener('click', closeDrawer);

    // 新增（侧栏）
    $('#addBtnSide').addEventListener('click', function(){ closeDrawer(); openForm(null); });
    // 恢复默认
    $('#resetBtn').addEventListener('click', function(){
      if(!confirm('恢复默认配方库将清除你新增/编辑/删除的自定义改动，确定继续？')) return;
      store = { custom: [], deleted: [] }; saveStore(store);
      recipes = RECIPES.slice();
      servings = {}; recipes.forEach(function(r){ servings[r.id] = r.b; });
      state.view='home'; renderAll(); toast('↺ 已恢复默认配方库');
    });

    // 主区域事件委托
    $('#main').addEventListener('click', function(e){
      var actEl = e.target.closest('[data-act]');
      if(actEl){
        var card = actEl.closest('.rc'); if(!card) return;
        var id = card.dataset.id;
        var act = actEl.dataset.act;
        if(act === 'inc') updateCardServings(id, (servings[id]||1) + 1);
        else if(act === 'dec') updateCardServings(id, (servings[id]||1) - 1);
        else if(act === 'inp'){ /* 输入时实时换算在 input 事件处理 */ }
        else if(act === 'reset'){ updateCardServings(id, (recipes.filter(function(r){return r.id===id;})[0]||{}).b || 1); }
        else if(act === 'steps'){ openSteps(recipes.filter(function(r){return r.id===id;})[0]); }
        else if(act === 'edit'){ openForm(recipes.filter(function(r){return r.id===id;})[0]); }
        else if(act === 'del'){ deleteRecipe(id); }
        return;
      }
      var jump = e.target.closest('.jump');
      if(jump){ /* jump 自带监听 */ }
    });
    $('#main').addEventListener('input', function(e){
      var inp = e.target.closest('.conv input[data-act="inp"]');
      if(inp){ var card = inp.closest('.rc'); if(card) updateCardServings(card.dataset.id, parseFloat(inp.value)); }
    });

    // 弹窗
    document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModals); });
    $('#fSave').addEventListener('click', saveForm);

    // 初始化弹窗选择面板
    fillCatSelect(); buildEmojiPick(); buildMemberPick();
  }

  function openDrawer(){ $('#sidebar').classList.add('open'); $('#drawerMask').classList.add('on'); }
  function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#drawerMask').classList.remove('on'); }

  /* ---------- 每日灵感弹窗 ---------- */
  function showGreet(){
    var gm = document.getElementById('greetModal');
    if(!gm) return;
    var m = MEMBERS[Math.floor(Math.random()*MEMBERS.length)];
    var food = (typeof RECIPES !== 'undefined' && RECIPES.length) ? RECIPES[Math.floor(Math.random()*RECIPES.length)].n : '甜点';
    var iconBox = gm.querySelector('.greet-ico');
    if(iconBox) iconBox.innerHTML = memberSVG(m);
    var txt = gm.querySelector('.greet-txt');
    if(txt) txt.innerHTML = '<span class="g-name">'+esc(m.en)+'</span><span class="g-verb">今天想吃</span><strong class="g-food">'+esc(food)+'</strong>';
    gm.hidden = false;
    function closeGreet(){ gm.hidden = true; }
    var closers = gm.querySelectorAll('[data-greet-close]');
    Array.prototype.forEach.call(closers, function(c){
      c.addEventListener('click', closeGreet);
    });
  }

  /* ---------- 启动 ---------- */
  function init(){
    try{
      try{ var th = localStorage.getItem('carat-theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
      try{ var fs = localStorage.getItem('carat-fs'); if(fs) document.documentElement.setAttribute('data-fs', fs); }catch(e){}
      buildPhotoWall();
      buildMemberStrip();
      bindUI();
      applyTheme();
      applyFs();
      renderAll();
      try{ showGreet(); }catch(e){ console.warn('greet 弹窗渲染失败：', e); }
    }catch(err){
      console.error('克拉烘焙台初始化失败：', err);
      var main = document.getElementById('main');
      if(main){ main.innerHTML = '<div class="error-box">⚠️ 页面渲染出错：'+esc(String(err && err.message || err))+'<br>请刷新重试，或重新打开本文件。</div>'; }
    }
  }
  init();
})();
</script>
</body>
</html>
